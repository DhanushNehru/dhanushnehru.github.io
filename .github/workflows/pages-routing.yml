name: Pages routing guard

on:
  pull_request:
  push:
    branches: [main, feature]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Keep the Netlify domain out of the GitHub user site
        run: |
          test ! -e CNAME
          test ! -e public/CNAME
          test -f .nojekyll
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          assert "location.pathname === '/'" in text
          assert "location.pathname === '/index.html'" in text
          assert "location.replace('https://dhanushnehru.got-a.page/'" in text
          assert '/src/main.tsx' not in text
          print('Pages routing guard passed')
          PY
      - name: Check public project-site HTTP routes on demand
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-pages.py
